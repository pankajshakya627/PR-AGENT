name: Security Scan

# Works on ALL repos (no GitHub Advanced Security required)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read

# Cancel in-progress runs
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Audit Dependencies
        run: |
          echo "🔍 Checking for known vulnerabilities..."
          pip-audit -r requirements.txt --desc || true
          
      - name: Check for outdated packages
        run: |
          pip install pip-check
          pip-check || true

  lint-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install linters
        run: pip install ruff bandit
      
      - name: Run Ruff (fast linter)
        run: ruff check . --output-format=github || true
      
      - name: Run Bandit (security linter)
        run: bandit -r src/ -ll || true

